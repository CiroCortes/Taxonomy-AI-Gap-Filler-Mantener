{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PESCO S.A. | Iniciar Sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--border:#334155;--blue:#38bdf8;--indigo:#6366f1;--text:#f8fafc;--muted:#94a3b8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:#0d1b2a;color:#f0f8ff;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .login-wrap{width:100%;max-width:420px;padding:1rem;}
  .card{background:#132337;border:1px solid #1e3450;border-radius:1.25rem;padding:2.5rem 2rem;box-shadow:0 25px 60px rgba(0,0,0,.5);}
  .logo{text-align:center;margin-bottom:2rem;}
  .logo-badge{display:inline-block;background:linear-gradient(135deg,#00B4D8,#0096B8);color:#fff;font-weight:700;padding:.45rem 1rem;border-radius:.6rem;font-size:1.1rem;letter-spacing:.05em;margin-bottom:.75rem;}
  .logo h1{font-size:1.25rem;color:#f0f8ff;font-weight:600;}
  .logo p{color:#8eb8d4;font-size:.85rem;margin-top:.25rem;}
  label{display:block;font-size:.8rem;font-weight:600;color:#8eb8d4;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em;}
  input{width:100%;padding:.75rem 1rem;background:#0d1b2a;border:1px solid #1e3450;border-radius:.6rem;color:#f0f8ff;font-size:.95rem;outline:none;transition:border-color .2s;}
  input:focus{border-color:#00B4D8;}
  .field{margin-bottom:1.25rem;}
  .btn-login{width:100%;padding:.85rem;background:linear-gradient(135deg,#0284c7,#4f46e5);color:#fff;border:none;border-radius:.6rem;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:.03em;transition:opacity .2s;margin-top:.5rem;}
  .btn-login:hover{opacity:.88;}
  .error-msg{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);color:#f87171;padding:.75rem 1rem;border-radius:.6rem;font-size:.875rem;margin-bottom:1.25rem;}
  .hint{text-align:center;font-size:.78rem;color:var(--muted);margin-top:1.5rem;}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="card">
    <div class="logo">
      <div class="logo-badge">PESCO S.A.</div>
      <h1>Portal de Requerimientos</h1>
      <p>Ingresa tus credenciales para continuar</p>
    </div>
    {% if error %}
    <div class="error-msg">⚠ {{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" type="text" name="username" placeholder="tu_usuario" required autofocus>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" placeholder="••••••••" required>
      </div>
      <button class="btn-login" type="submit">🔐 Iniciar Sesión</button>
    </form>
    <p class="hint">¿Problemas para acceder? Contacta al administrador del sistema.</p>
  </div>
</div>
</body>
</html>
