{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PESCO S.A. | Iniciar Sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  (function() {
    var savedTheme = localStorage.getItem('pesco_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  })();
</script>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-heading: #0f172a;
    --muted: #64748b;
    --input-bg: #ffffff;
    --input-border: #cbd5e1;
    --blue: #00B4D8;
    --blue-dark: #0077B6;
    --card-shadow: 0 20px 45px rgba(0,0,0,0.08);
  }

  [data-theme="dark"] {
    --bg: #09121d;
    --card: #132337;
    --border: #1e3450;
    --text: #f0f8ff;
    --text-heading: #ffffff;
    --muted: #8eb8d4;
    --input-bg: #0c1826;
    --input-border: #1e3450;
    --blue: #00B4D8;
    --blue-dark: #0096B8;
    --card-shadow: 0 25px 60px rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    transition: background-color .25s ease, color .25s ease;
  }

  .theme-bar {
    position: absolute;
    top: 1.25rem;
    right: 1.5rem;
  }
  .theme-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.4rem 0.85rem;
    border-radius: 9999px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    transition: all 0.2s ease;
  }
  .theme-toggle-btn:hover {
    border-color: var(--blue);
  }

  .login-wrap {
    width: 100%;
    max-width: 440px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 1.25rem;
    padding: 2.5rem 2.25rem;
    box-shadow: var(--card-shadow);
  }

  .logo {
    text-align: center;
    margin-bottom: 2rem;
  }
  .logo-img {
    height: 52px;
    width: auto;
    margin-bottom: 0.85rem;
    border-radius: 6px;
  }
  .logo h1 {
    font-size: 1.35rem;
    color: var(--text-heading);
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .logo p {
    color: var(--muted);
    font-size: 0.88rem;
    margin-top: 0.35rem;
  }

  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 0.45rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input {
    width: 100%;
    padding: 0.8rem 1rem;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 0.6rem;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.15);
  }
  .field {
    margin-bottom: 1.25rem;
  }

  .btn-login {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, #00B4D8, #0077B6);
    color: #fff;
    border: none;
    border-radius: 0.65rem;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity 0.2s, transform 0.2s;
    margin-top: 0.5rem;
    box-shadow: 0 4px 14px rgba(0, 180, 216, 0.3);
  }
  .btn-login:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }

  .error-msg {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #ef4444;
    padding: 0.75rem 1rem;
    border-radius: 0.6rem;
    font-size: 0.875rem;
    margin-bottom: 1.25rem;
    font-weight: 600;
  }
  .hint {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 1.5rem;
  }
</style>
</head>
<body>
<div class="theme-bar">
  <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="togglePescoTheme()" type="button" title="Alternar tema">
    <span id="theme-icon">🌙</span>
    <span id="theme-text">Modo Oscuro</span>
  </button>
</div>

<div class="login-wrap">
  <div class="card">
    <div class="logo">
      <img src="{% static 'img/pesco_logo.png' %}" alt="PESCO S.A." class="logo-img" onerror="this.style.display='none'">
      <h1>Portal de Solicitudes</h1>
      <p>Gestión de Códigos SAP y Compras PESCO</p>
    </div>
    {% if error %}
    <div class="error-msg">⚠ {{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" type="text" name="username" placeholder="solicitante o admin" required autofocus>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" placeholder="••••••••" required>
      </div>
      <button class="btn-login" type="submit">🔐 Iniciar Sesión</button>
    </form>
    <p class="hint">Credenciales de prueba disponibles para solicitante y administrador.</p>
  </div>
</div>

<script>
  function updateThemeUI(theme) {
    const icon = document.getElementById('theme-icon');
    const text = document.getElementById('theme-text');
    if (!icon || !text) return;
    if (theme === 'dark') {
      icon.textContent = '☀️';
      text.textContent = 'Modo Claro';
    } else {
      icon.textContent = '🌙';
      text.textContent = 'Modo Oscuro';
    }
  }

  function togglePescoTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('pesco_theme', next);
    updateThemeUI(next);
  }

  document.addEventListener('DOMContentLoaded', function() {
    const active = document.documentElement.getAttribute('data-theme') || 'light';
    updateThemeUI(active);
  });
</script>
</body>
</html>
