<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PESCO Portal{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1b2a;--card:#132337;--card2:#1a2e45;--border:#1e3450;--blue:#00B4D8;--indigo:#0096B8;--amber:#FFC107;--emerald:#4CAF50;--rose:#F44336;--text:#f0f8ff;--muted:#8eb8d4;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:rgba(13,27,42,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;padding:.9rem 2rem;display:flex;justify-content:space-between;align-items:center;}
.logo-badge{background:linear-gradient(135deg,#00B4D8,#0096B8);color:#fff;font-weight:700;padding:.35rem .8rem;border-radius:.5rem;font-size:.9rem;letter-spacing:.04em;}
.logo-title{font-size:1.1rem;font-weight:700;margin-left:.65rem;}
.nav-links{display:flex;gap:.5rem;align-items:center;}
.nav-link{color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:600;padding:.4rem .8rem;border-radius:.5rem;transition:all .2s;}
.nav-link:hover,.nav-link.active{color:var(--text);background:var(--card);}
.nav-link.admin{color:var(--amber);}
.user-badge{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);color:var(--indigo);font-size:.78rem;font-weight:600;padding:.3rem .7rem;border-radius:9999px;}
main{max-width:1350px;margin:2rem auto;padding:0 1.5rem;}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.page-title{font-size:1.6rem;font-weight:700;}
.page-subtitle{color:var(--muted);margin-top:.3rem;font-size:.9rem;}
.kpi-badges{display:flex;gap:.75rem;flex-wrap:wrap;}
.kpi-badge{padding:.45rem 1rem;border-radius:9999px;font-size:.8rem;font-weight:600;}
.kpi-amber{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:var(--amber);}
.kpi-blue{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.3);color:var(--blue);}
.filter-bar{display:flex;align-items:center;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.filter-label{color:var(--muted);font-size:.8rem;font-weight:600;}
.filter-btn{padding:.35rem .8rem;border-radius:.5rem;font-size:.8rem;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--border);transition:all .2s;}
.filter-btn:hover,.filter-btn.active{background:var(--card);color:var(--text);border-color:var(--blue);}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:1.5rem;}
.section-title{font-size:1rem;font-weight:700;margin-bottom:1.25rem;color:var(--blue);}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.82rem;}
th{text-align:left;padding:.65rem .75rem;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:.65rem .75rem;border-bottom:1px solid rgba(51,65,85,.5);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
code.code-chip{background:#0f172a;border:1px solid var(--border);padding:.2rem .5rem;border-radius:.35rem;font-size:.8rem;color:var(--blue);font-family:'Courier New',monospace;}
code.code-chip.muted{color:var(--muted);}
.badge-status{display:inline-block;padding:.2rem .6rem;border-radius:9999px;font-size:.72rem;font-weight:700;}
.badge-pendiente{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:var(--amber);}
.badge-aprobado{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:var(--emerald);}
.badge-rechazado{background:rgba(244,63,94,.15);border:1px solid rgba(244,63,94,.3);color:var(--rose);}
.badge-tipo{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);color:var(--blue);display:inline-block;padding:.15rem .5rem;border-radius:.35rem;font-size:.72rem;font-weight:600;}
.action-btns{display:flex;gap:.3rem;}
.btn-action{width:2rem;height:2rem;border-radius:.4rem;border:none;cursor:pointer;font-size:.9rem;transition:all .2s;}
.btn-action.approve{background:rgba(16,185,129,.15);color:var(--emerald);}
.btn-action.approve:hover{background:rgba(16,185,129,.3);}
.btn-action.reject{background:rgba(244,63,94,.15);color:var(--rose);}
.btn-action.reject:hover{background:rgba(244,63,94,.3);}
.btn-action.detail{background:rgba(56,189,248,.1);color:var(--blue);}
.btn-action.detail:hover{background:rgba(56,189,248,.25);}
.empty-state{text-align:center;padding:2rem;color:var(--muted);font-size:.9rem;}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:999;display:flex;align-items:center;justify-content:center;}
.modal-overlay.hidden{display:none;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:2rem;max-width:500px;width:90%;}
.modal-title{font-size:1.1rem;font-weight:700;margin-bottom:1rem;}
.modal-body{color:var(--muted);font-size:.875rem;margin-bottom:1rem;}
.modal-label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.4rem;}
textarea{width:100%;padding:.65rem;background:#0f172a;border:1px solid var(--border);border-radius:.5rem;color:var(--text);font-size:.85rem;resize:vertical;}
.modal-footer{margin-top:1rem;}
.modal-actions{display:flex;gap:.5rem;margin-top:.75rem;}
.btn-modal{flex:1;padding:.6rem;border:none;border-radius:.5rem;font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .2s;}
.btn-modal.approve{background:var(--emerald);color:#fff;}
.btn-modal.reject{background:var(--rose);color:#fff;}
.btn-modal.cancel{background:var(--card);color:var(--muted);border:1px solid var(--border);}
.btn-modal:hover{opacity:.85;}
/* Formularios */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:2rem;max-width:820px;margin:0 auto;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.form-group{display:flex;flex-direction:column;gap:.4rem;}
.form-group.full{grid-column:1/-1;}
.form-label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.form-label.required::after{content:" *";color:var(--rose);}
.form-input,.form-select,.form-textarea{background:#0f172a;border:1px solid var(--border);border-radius:.6rem;color:var(--text);padding:.7rem 1rem;font-size:.9rem;outline:none;transition:border-color .2s;font-family:'Inter',sans-serif;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue);}
.form-select option{background:#1e293b;}
.form-textarea{resize:vertical;min-height:80px;}
.autocomplete-box{position:relative;}
.autocomplete-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#1e293b;border:1px solid var(--blue);border-radius:.6rem;z-index:100;max-height:250px;overflow-y:auto;display:none;}
.autocomplete-item{padding:.65rem 1rem;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;}
.autocomplete-item:hover{background:#334155;}
.autocomplete-item:last-child{border-bottom:none;}
.autocomplete-item .code{font-family:monospace;color:var(--blue);font-size:.8rem;}
.autocomplete-item .name{font-size:.82rem;color:var(--text);}
.correlative-preview{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);border-radius:.6rem;padding:.75rem 1rem;margin-top:.5rem;display:none;}
.correlative-preview .label{font-size:.72rem;color:var(--muted);margin-bottom:.3rem;font-weight:600;}
.correlative-preview .value{font-size:1.2rem;font-weight:700;color:var(--blue);font-family:monospace;}
.ai-assistant-box{background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.25);border-radius:.75rem;padding:1rem;margin-top:1rem;}
.ai-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.1rem;background:linear-gradient(135deg,#00B4D8,#0096B8);color:#fff;border:none;border-radius:.5rem;font-size:.82rem;font-weight:600;cursor:pointer;transition:opacity .2s;}
.ai-btn:hover{opacity:.85;}
.ai-btn:disabled{opacity:.5;cursor:not-allowed;}
.ai-result{margin-top:.75rem;display:none;}
.ai-score-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:.5rem 0;}
.ai-score-fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--amber),var(--emerald));border-radius:3px;transition:width .8s ease;}
.ai-suggestion-list{list-style:none;display:flex;flex-direction:column;gap:.3rem;}
.ai-suggestion-list li{font-size:.8rem;color:var(--muted);padding:.25rem 0;}
.ai-warning-list li{color:#fbbf24;}
.apply-desc-btn{margin-top:.5rem;padding:.4rem .85rem;background:rgba(16,185,129,.15);color:var(--emerald);border:1px solid rgba(16,185,129,.3);border-radius:.4rem;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;}
.apply-desc-btn:hover{background:rgba(16,185,129,.3);}
.btn-submit{width:100%;padding:.9rem;background:linear-gradient(135deg,#00B4D8,#0096B8);color:#fff;border:none;border-radius:.6rem;font-size:1rem;font-weight:700;cursor:pointer;margin-top:1.5rem;transition:opacity .2s;}
.btn-submit:hover{opacity:.88;}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}
.success-panel{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:.75rem;padding:1.5rem;text-align:center;display:none;}
.success-panel h3{color:var(--emerald);font-size:1.1rem;margin-bottom:.5rem;}
.taxonomy-preview{background:#0f172a;border:1px solid var(--border);border-radius:.6rem;padding:.75rem 1rem;margin-top:.5rem;font-size:.8rem;color:var(--muted);display:none;}
.taxonomy-preview span{color:var(--text);font-weight:500;}
</style>
</head>
<body>
<div style="display:none;">{% csrf_token %}</div>
<header>
  <div style="display:flex;align-items:center;">
    <span class="logo-badge">PESCO S.A.</span>
    <span class="logo-title">Portal de Requerimientos</span>
  </div>
  <nav class="nav-links">
    <a href="{% url 'taxonomy:solicitudes_nueva_codigo' %}" class="nav-link {% if request.resolver_match.url_name == 'solicitudes_nueva_codigo' %}active{% endif %}">📝 Nuevo Código</a>
    <a href="{% url 'taxonomy:solicitudes_nueva_compra' %}" class="nav-link {% if request.resolver_match.url_name == 'solicitudes_nueva_compra' %}active{% endif %}">🛒 Nueva Compra</a>
    {% if user.is_staff %}
    <a href="{% url 'taxonomy:solicitudes_dashboard' %}" class="nav-link admin {% if request.resolver_match.url_name == 'solicitudes_dashboard' %}active{% endif %}">⚙ Admin</a>
    <a href="/" class="nav-link">📊 Dashboard IA</a>
    {% endif %}
  </nav>
  <div style="display:flex;align-items:center;gap:.75rem;">
    <span class="user-badge">👤 {{ user.username }}</span>
    <a href="{% url 'taxonomy:logout' %}" class="nav-link" style="color:var(--rose);">Salir</a>
  </div>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
