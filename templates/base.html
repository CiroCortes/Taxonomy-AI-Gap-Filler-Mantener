<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PESCO S.A. | Maestro de Artículos & AI Gap-Filler{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1b2a;
            --bg-card: #132337;
            --bg-card-hover: #1e3450;
            --accent-blue: #00B4D8;
            --accent-indigo: #0096B8;
            --accent-amber: #FFC107;
            --accent-emerald: #4CAF50;
            --accent-rose: #F44336;
            --text-main: #f0f8ff;
            --text-muted: #8eb8d4;
            --border-color: #1e3450;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-badge {
            background: linear-gradient(135deg, #00B4D8, #0096B8);
            color: white;
            font-weight: 700;
            padding: 0.35rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            letter-spacing: 0.04em;
        }

        .logo-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .nav-links {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.4rem 0.85rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
            background-color: var(--bg-card-hover);
        }

        main {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00B4D8, #0096B8);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: var(--bg-card-hover);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-info { background: rgba(0, 180, 216, 0.15); color: #00B4D8; border: 1px solid rgba(0, 180, 216, 0.3); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div style="display: none;">{% csrf_token %}</div>
    <header>
        <div class="logo-container">
            <span class="logo-badge">PESCO S.A.</span>
            <span class="logo-title">Maestro de Artículos & AI Gap-Filler</span>
        </div>

        <nav class="nav-links">
            <a href="{% url 'taxonomy:sku_list' %}" class="nav-link {% if request.resolver_match.url_name == 'sku_list' %}active{% endif %}">
                📊 Maestro &amp; Dashboard
            </a>
            <a href="{% url 'taxonomy:batch_ai' %}" class="nav-link {% if request.resolver_match.url_name == 'batch_ai' %}active{% endif %}">
                ✨ Clasificación por Lotes (Pruebas IA)
            </a>
            <a href="{% url 'taxonomy:solicitudes_nueva_codigo' %}" class="nav-link" style="border:1px solid rgba(99,102,241,.4);color:#a78bfa;">
                📋 Portal Requerimientos
            </a>
        </nav>

        <div>
            <span class="badge badge-info">Gemini 3.6 Flash + RAG SAP</span>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
